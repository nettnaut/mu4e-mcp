name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check
        run: python -m py_compile mu4e-mcp.py
      - name: tools/list smoke check
        # No `mu` needed — tools/list does not shell out. Asserts the server
        # responds and advertises both tools.
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python mu4e-mcp.py \
            | python -c "import sys, json; d = json.loads(sys.stdin.read()); names = [t['name'] for t in d['result']['tools']]; assert {'search_email', 'get_email'} <= set(names), names; print('smoke ok:', names)"
